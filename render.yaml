# Render Blueprint — infraestructura como código (plan gratuito).
# Deploy: conectar este repo a Render y "New > Blueprint".
# Nota: la BD gratuita de Render expira a los 30 días (hay que re-crearla o migrar).

databases:
  - name: analytics-dashboard-db
    plan: free

services:
  - type: web
    name: analytics-dashboard-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/metrics/snapshot/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: analytics-dashboard-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://analytics-dashboard-eta-peach.vercel.app"
      - key: ADMIN_FETCH_TOKEN
        generateValue: true
      - key: PRODUCT_HUNT_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CELERY_BROKER_URL
        value: "redis://127.0.0.1:6379/0"
      - key: REDIS_HOST
        value: "127.0.0.1"
      - key: REDIS_PORT
        value: "6379"

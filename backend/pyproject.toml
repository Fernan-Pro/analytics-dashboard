[project]
name = "backend"
version = "0.1.0"
description = "Analytics Dashboard - Django REST API (GitHub, Reddit, Product Hunt)"
authors = [
    {name = "Fernan-Pro",email = "ferqtexwinner@gmail.com"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "django (>=5.2,<5.3)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "django-filter (>=26.1,<27.0)",
    "gunicorn (>=23.0.0,<24.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
